<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameboy</title>
<style>
/* Layout: one handheld, centered, controls sized for thumbs; notes below. Single deliberate look (grey plastic). */
:root {
  --page: #d9d6cf;
  --shell: #c8c4bc;
  --shell-dark: #a9a49a;
  --bezel: #5d5f6b;
  --lcd: #9bbc0f;
  --ink: #2b2a33;
  --btn: #8b1d4f;
  --muted: #5b584f;
  --display: "Courier New", monospace;
  --body: system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { background: var(--page); color: var(--ink); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--body); padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.stage { min-width: 0; }
.boy { background: var(--shell); border-radius: 14px 14px 64px 14px; padding: 18px 18px 26px;
  box-shadow: inset -4px -6px 0 var(--shell-dark), 0 10px 24px rgba(40,36,30,.25);
  user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.bezel { background: var(--bezel); border-radius: 10px 10px 36px 10px; padding: 14px 22px 10px; }
.bezel-top { display: flex; align-items: center; gap: 6px; color: #b9bac6; font: 600 9px/1 var(--body);
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.bezel-top::before, .bezel-top::after { content: ""; flex: 1; height: 2px; background: #8b2b57;
  box-shadow: 0 4px 0 #2b3a7a; margin-bottom: 4px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: #3a2a2a; margin: 0 4px 0 -12px; }
.led.on { background: #e8303a; box-shadow: 0 0 6px #e8303a; }
.screen-row { display: flex; align-items: center; }
.screen { position: relative; width: 100%; aspect-ratio: 160 / 144; max-width: 100%; background: var(--lcd);
  border-radius: 2px; overflow: hidden; }
.screen::after { content: ""; position: absolute; inset: 0; background: #a8c41a; mix-blend-mode: multiply; pointer-events: none; }
canvas#lcd { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.power { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; background: #8bac0f; color: #0f380f; border: 0; cursor: pointer;
  font: 700 20px/1.2 var(--display); text-align: center; padding: 16px; }
.power[hidden], [hidden] { display: none !important; }
.power small { font: 500 13px/1.3 var(--display); }
.brand { margin: 12px 4px 0; font: 700 20px/1 var(--display); color: #2b3a7a; letter-spacing: .02em; }
.controls { display: grid; grid-template-columns: 1fr 1fr; align-items: center; margin-top: 22px; }
.dpad { position: relative; width: 132px; height: 132px; }
.dpad button { position: absolute; width: 44px; height: 44px; background: #2b2a33; border: 0; padding: 0; }
.dpad .up { left: 44px; top: 0; border-radius: 6px 6px 0 0; }
.dpad .down { left: 44px; bottom: 0; border-radius: 0 0 6px 6px; }
.dpad .left { left: 0; top: 44px; border-radius: 6px 0 0 6px; }
.dpad .right { right: 0; top: 44px; border-radius: 0 6px 6px 0; }
.dpad .mid { position: absolute; left: 44px; top: 44px; width: 44px; height: 44px; background: #2b2a33; }
.dpad button::after { content: ""; position: absolute; inset: 14px; border-radius: 2px; background: #45434f; }
.ab { justify-self: end; display: flex; gap: 18px; transform: rotate(-24deg); margin-right: 4px; }
.ab div { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 12px/1 var(--display); color: #2b3a7a; }
.ab button { width: 62px; height: 62px; border-radius: 50%; background: var(--btn); border: 0;
  box-shadow: inset -3px -4px 0 rgba(0,0,0,.25); }
.ss { display: flex; justify-content: center; gap: 28px; margin-top: 26px; }
.ss div { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 11px/1 var(--display);
  color: #2b3a7a; letter-spacing: .06em; }
.ss button { width: 56px; height: 16px; border-radius: 8px; background: #8a8680; border: 0; transform: rotate(-24deg); }
.boy button[data-k] { touch-action: none; }
.boy button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.boy button.held, .boy button:active { filter: brightness(.75); }
.boy button:focus-visible { outline: 3px solid #2b3a7a; outline-offset: 2px; }
.notes { font-size: 14px; line-height: 1.55; color: var(--ink); }
.notes h2 { font: 700 18px/1.2 var(--display); margin: 0 0 8px; text-wrap: balance; }
.notes p { margin: 0 0 10px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.keys dt { font: 500 13px/1.5 var(--display); }
.keys dd { margin: 0; color: var(--muted); }
kbd { font: 500 12px var(--display); background: var(--shell); border-radius: 4px; padding: 1px 6px; }
.err { color: #8b1d4f; font-weight: 600; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.toolbar button { border: 1px solid #746e67; border-radius: 6px; min-height: 44px;
  padding: 0 12px; background: var(--shell); color: var(--ink); font: inherit; cursor: pointer; }
body.projecting { overflow: hidden; }
.stage.projecting { position: fixed; inset: 0; z-index: 1; }
.stage:is(:fullscreen, .projecting) { display: flex; align-items: center; justify-content: center;
  flex-direction: column; background: var(--page); padding: 12px; overflow: auto; }
.stage:is(:fullscreen, .projecting) .boy { width: min(100%, calc((100dvh - 250px) * 1.11), 720px); min-width: 272px;
  padding: 0; box-shadow: none; background: transparent; }
.stage:is(:fullscreen, .projecting) .bezel { padding: 0; border-radius: 3px; }
.stage:is(:fullscreen, .projecting) .bezel-top, .stage:is(:fullscreen, .projecting) .led, .stage:is(:fullscreen, .projecting) .brand { display: none; }
.stage:is(:fullscreen, .projecting) .controls { margin-top: 10px; }
.stage:is(:fullscreen, .projecting) .ss { margin-top: 6px; }
@media (pointer: fine) {
  .stage:is(:fullscreen, .projecting) .boy { width: min(100%, calc((100dvh - 86px) * 1.11), 1280px); }
  .stage:is(:fullscreen, .projecting) .controls, .stage:is(:fullscreen, .projecting) .ss { display: none; }
}
@media (max-width: 380px) {
  .boy { padding-inline: 12px; }
  .dpad { width: 120px; height: 120px; }
  .dpad button, .dpad .mid { width: 40px; height: 40px; }
  .dpad .up, .dpad .down, .dpad .mid { left: 40px; }
  .dpad .left, .dpad .right, .dpad .mid { top: 40px; }
  .ab { gap: 12px; }
  .ab button { width: 50px; height: 50px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage">
  <div class="boy" id="boy">
    <div class="bezel">
      <div class="bezel-top">Dot Matrix with Stereo Sound</div>
      <div class="screen-row">
        <span class="led" id="led" aria-hidden="true"></span>
        <div class="screen">
          <canvas id="lcd" width="160" height="144" tabindex="-1" aria-label="Gameboy-Bildschirm"></canvas>
          <button class="power" id="power" type="button"><span id="power-label">EINSCHALTEN</span><small>OSTWALD EDITION</small></button>
        </div>
      </div>
    </div>
    <div class="brand">Gameboy</div>
    <div class="controls">
      <div class="dpad" aria-label="Steuerkreuz">
        <span class="mid"></span>
        <button class="up" data-k="UP" aria-label="Hoch"></button>
        <button class="left" data-k="LEFT" aria-label="Links"></button>
        <button class="right" data-k="RIGHT" aria-label="Rechts"></button>
        <button class="down" data-k="DOWN" aria-label="Runter"></button>
      </div>
      <div class="ab">
        <div><button data-k="B" aria-label="B"></button>B</div>
        <div><button data-k="A" aria-label="A"></button>A</div>
      </div>
    </div>
    <div class="ss">
      <div><button data-k="SELECT" aria-label="Select"></button>SELECT</div>
      <div><button data-k="START" aria-label="Start"></button>START</div>
    </div>
  </div>

    <div class="toolbar">
      <button id="projection" type="button" aria-pressed="false">Großbild</button>
      <button id="sound" type="button" aria-pressed="true">Spielton</button>
    </div>
    <p id="status" class="err" role="status" hidden></p>
  </div>

  <section class="notes">
    <p>Mit <b>Vortrag</b> startest du eine kurze Runde Batterie-Regen und drei Quizfragen.
      Im Browser läuft dieselbe ROM wie in der <a href="ZEITREISE53.gb" download>Game-Boy-Datei</a>.</p>
    <dl class="keys">
      <dt>Pfeiltasten</dt><dd>Steuerkreuz</dd>
      <dt><kbd>X</kbd> / <kbd>Leertaste</kbd></dt><dd>A</dd>
      <dt><kbd>Z</kbd> / <kbd>Y</kbd></dt><dd>B</dd>
      <dt><kbd>Enter</kbd></dt><dd>Start (Pause bei Snake und Batterie-Regen)</dd>
      <dt><kbd>Shift</kbd></dt><dd>Select</dd>
    </dl>
  </section>
</main>

const held = new Map();
const pointers = new Map();
const buttons = document.querySelectorAll('.boy button[data-k]');
const stage = document.getElementById('stage');
const screen = document.getElementById('lcd');
const power = document.getElementById('power');
const powerLabel = document.getElementById('power-label');
const status = document.getElementById('status');
const projection = document.getElementById('projection');
const sound = document.getElementById('sound');
const KEYMAP = { ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
  x:'A', X:'A', ' ':'A', z:'B', Z:'B', y:'B', Y:'B', Enter:'START', Shift:'SELECT' };
const audioGains = new Map();
let WB, running = false, starting = false;

function updateInput() {
  const active = new Set(held.values());
  const state = {};
  for (const button of buttons) {
    const key = button.dataset.k;
    state[key] = active.has(key);
    button.classList.toggle('held', state[key]);
  }
  if (running) WB.setJoypadState(state);
}

function resetInput() {
  held.clear();
  pointers.clear();
  updateInput();
}

function setInput(source, key) {
  if (key) held.set(source, key);
  else held.delete(source);
  updateInput();
}

function releasePointer(event, minimum = 0) {
  const press = pointers.get(event.pointerId);
  if (!press) return;
  pointers.delete(event.pointerId);
  const remaining = minimum - (performance.now() - press.started);
  if (remaining > 0) window.setTimeout(() => setInput(press), remaining);
  else setInput(press);
}

for (const button of buttons) {
  button.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    const press = { started: performance.now() };
    pointers.set(event.pointerId, press);
    setInput(press, button.dataset.k);
  });
  button.addEventListener('pointerup', event => releasePointer(event, 70));
  button.addEventListener('pointercancel', releasePointer);
  button.addEventListener('lostpointercapture', releasePointer);
  button.addEventListener('click', event => {
    if (event.detail !== 0 || !running) return;
    const source = button;
    setInput(source, button.dataset.k);
    window.setTimeout(() => setInput(source), 100);
  });
  button.addEventListener('contextmenu', event => event.preventDefault());
}

function nativeActivation(event) {
  return (event.key === ' ' || event.key === 'Enter') &&
    event.target.closest?.('button, a, input, select, textarea');
}

addEventListener('keydown', event => {
  const key = KEYMAP[event.key];
  if (!key || nativeActivation(event) || event.altKey || event.metaKey || event.ctrlKey) return;
  event.preventDefault();
  if (event.repeat) return;
  if (!running) {
    if (key === 'A' || key === 'START') start();
    return;
  }
  setInput('keyboard-' + (event.code || event.key), key);
});
addEventListener('keyup', event => {
  const source = 'keyboard-' + (event.code || event.key);
  if (held.has(source)) {
    event.preventDefault();
    setInput(source);
  }
});
addEventListener('blur', resetInput);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetInput();
});

function romBytes() {
  return Uint8Array.from(atob(ROM_B64), byte => byte.charCodeAt(0));
}

function soundEnabled() {
  return sound.getAttribute('aria-pressed') === 'true';
}

function routeAudio(context, source) {
  let gain = audioGains.get(context);
  if (!gain) {
    gain = context.createGain();
    gain.gain.value = Number(soundEnabled());
    audioGains.set(context, gain);
  }
  source.connect(gain);
  return gain;
}

sound.addEventListener('click', () => {
  const enabled = !soundEnabled();
  sound.setAttribute('aria-pressed', String(enabled));
  for (const gain of audioGains.values()) gain.gain.value = Number(enabled);
  if (running && enabled) WB.resumeAudioContext();
});

function projecting() {
  return document.fullscreenElement === stage || stage.classList.contains('projecting');
}

function updateProjection() {
  const active = projecting();
  projection.textContent = active ? 'Großbild beenden' : 'Großbild';
  projection.setAttribute('aria-pressed', String(active));
  if (running && active) screen.focus({ preventScroll: true });
}

function setWindowProjection(active) {
  stage.classList.toggle('projecting', active);
  document.body.classList.toggle('projecting', active);
  updateProjection();
}

projection.addEventListener('click', async () => {
  if (stage.classList.contains('projecting')) {
    setWindowProjection(false);
  } else if (document.fullscreenElement === stage) {
    await document.exitFullscreen();
  } else if (stage.requestFullscreen && document.fullscreenEnabled) {
    try {
      await stage.requestFullscreen();
    } catch {
      setWindowProjection(true);
    }
  } else {
    setWindowProjection(true);
  }
});
document.addEventListener('fullscreenchange', updateProjection);
addEventListener('keydown', event => {
  if (event.key === 'Escape' && stage.classList.contains('projecting')) {
    setWindowProjection(false);
    projection.focus();
  }
});

async function start() {
  if (running || starting) return;
  starting = true;
  power.disabled = true;
  powerLabel.textContent = 'LÄDT …';
  status.hidden = true;
  status.textContent = '';
  resetInput();
  try {
    WB = window.WasmBoy?.WasmBoy;
    if (!WB) throw new Error('Der Emulator fehlt. Öffne die Seite mit ihrem Ordner „vendor“.');
    WB.resumeAudioContext();
    await WB.config({
      isGbcEnabled: false, isGbcColorizationEnabled: false, isAudioEnabled: true,
      updateAudioCallback: routeAudio
    }, screen);
    WB.disableDefaultJoypad();
    await WB.loadROM(romBytes());
    await WB.play();
    running = true;
    power.hidden = true;
    document.getElementById('led').classList.add('on');
    screen.focus({ preventScroll: true });
    updateInput();
  } catch (error) {
    console.error(error);
    status.textContent = error?.message || 'Der Emulator ist nicht gestartet. Versuche es erneut.';
    status.hidden = false;
    powerLabel.textContent = 'ERNEUT VERSUCHEN';
  } finally {
    starting = false;
    power.disabled = false;
  }
}
power.addEventListener('click', start);
</script>
